server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for faster loading on mobile
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml image/svg+xml font/woff2 application/json;

    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    location = /admin {
        try_files /admin.html =404;
    }

    # Config.js must never be cached so updates appear instantly
    location = /config.js {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Media & fonts caching
    location ~* \.(?:css|js|woff2|woff|ttf|png|jpg|jpeg|gif|webp|svg|ico|mp3|mp4)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
